<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logbook | ARC Raiders</title>
  <link rel="icon" type="image/png" href="https://sic4riodragon.uk/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body data-page="logbook" data-account="dusk">
  <div class="bg"></div>

  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/arcraider_logo.png" alt="ARC Raiders">
      <span><strong>ARC Raiders</strong><small>quest tracker</small></span>
    </a>

    <nav class="nav">
      <a href="/">Main</a>
      
      <a class="active" href="/dusk/">Overview</a>
      <a href="/dusk/quests/">Quests</a>
      <a href="/dusk/logbook/">Logbook</a>
      <a href="/dusk/projects/">Projects</a>
      <a href="/dusk/achievements/">Achievements</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="page-head">
      <p class="eyebrow">Main</p>
      <h1>Logbook</h1>
    </section>

    <section class="logbook-layout">
      <div class="panel">
        <div class="section-title">
          <h2>Quests</h2>
          <span id="logbook-quest-count">0 active</span>
        </div>
        <div id="logbook-quests" class="quest-list logbook"></div>
      </div>

      <div class="panel">
        <div class="section-title">
          <h2>Tracked resources</h2>
          <span>resources + stations</span>
        </div>
        <div id="logbook-resources"></div>
      </div>
    </section>
  </main>

  <script src="/assets/js/main.js"></script>
</body>
</html>
